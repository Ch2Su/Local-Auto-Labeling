# ===========================================================
#  로컬 자동 라벨링 파이프라인 설정
#  경로는 이 파일이 있는 폴더 기준 상대경로 또는 절대경로
# ===========================================================

data:
  # 이미 손으로 라벨링해 둔 시드 데이터 (YOLO 포맷). 하위 폴더까지 재귀 탐색합니다.
  #
  # 경로에 images/ 폴더가 있으면 같은 위치의 labels/ 에서 .txt 를 찾습니다.
  # 따라서 아래 두 레이아웃이 모두 그대로 동작합니다.
  #   data/visible/seed/images/x.jpg                -> data/visible/seed/labels/x.txt
  #   data/visible/seed/{train,valid,test}/images/  -> 각 폴더의 labels/   (Roboflow 내보내기)
  #
  # seed 루트를 통째로 지정하면 train/valid/test 를 전부 학습 풀에 넣고, 이 도구의
  # 분할(train.val_ratio·test_ratio, DB 에 고정)로 다시 나눕니다.
  # (지금은 아래 seed_coco 를 쓰므로 이 두 줄은 읽히지 않습니다.)
  # 2026-09-21: 가시광 데이터를 data/visible/ 로 모았다 (열화상·화재와 구조를 맞춤).
  # 옮기면서 DB 의 images.path 6,478행도 같이 치환했다 — 절대경로로 들고 있기 때문이다.
  seed_images: data/visible/legacy/seed
  seed_labels: data/visible/legacy/seed/labels
  # COCO JSON 으로 시드를 읽으려면 여기에 폴더(또는 json 파일)를 지정합니다.
  # 지정하면 위의 seed_images/seed_labels 대신 이쪽을 사용합니다.
  #
  # 현재 구조 (2026-09-09, 09-21 에 data/visible/ 아래로, 2026-11-03 에 legacy/ 아래로 옮김).
  # 로보플로 내보내기를 회차별로 쌓습니다.
  #   data/visible/legacy/seed/seed1/{coco/*.json, images/}   5,929장  최초 시드
  #   data/visible/legacy/seed/seed2/{coco/*.json, images/}      26장  추가분
  #
  # 루트만 지정하면 하위의 COCO json 을 전부 찾아 읽습니다. 다음 회차는
  # seed3 폴더를 같은 모양으로 넣고 scan 만 돌리면 됩니다.
  # 이미지는 json 옆이나 같은 폴더의 images/ 어느 쪽에 있어도 찾습니다
  # (coco_io._image_dirs 참고).
  seed_coco: data/visible/legacy/seed

  # 자동 라벨링할 이미지들 (하위 폴더까지 재귀 탐색)
  # 2026-11-03 부터 새 수집분은 unlabeled/<카메라키>/[<YYYYMMDD>/]<파일> 에 둔다 — 첫 폴더가 카메라다.
  # 카메라는 아래 cameras 파일에 먼저 등록해야 하고, 등록 안 된 폴더가 있으면 scan 이 아무것도 넣지 않고
  # 멈춘다. 바로 아래 둔 파일은 출처 없이 들어간다. 규칙 전문은 docs/provenance.md.
  unlabeled: data/visible/unlabeled
  # 카메라(출처 단위) 등록 파일. 실제 설치 장소를 담으니 data/ 밖(저장소)으로 옮기지 말 것.
  cameras: data/visible/cameras.yaml
  # '정리' 버튼으로 검수 완료 이미지를 옮겨 모으는 곳.
  # 이미지와 라벨 .txt 가 함께 저장되므로 그 자체로 완결된 YOLO 데이터셋이 됩니다.
  # 2026-11-03: 그때까지 정리된 718장은 data/visible/legacy/labeled 로 옮겼다. 여기는 그 뒤 새로
  # 수집한 이미지의 정리 결과만 쌓인다(첫 '정리' 때 만들어진다).
  labeled: data/visible/labeled
  # 학습용으로 자동 빌드되는 데이터셋 (직접 건드릴 필요 없음)
  dataset: data/visible/dataset
  # 라벨/검수 상태 DB
  db: data/visible/labeling.db
  # scan 이 새 파일을 등록할 때, 이미 있는 이미지와 **내용(바이트)이 같으면** 등록하지 않고
  # 리포트에만 남긴다 (2026-09-23, dupcheck.py). 로보플로 재내보내기가 새 이름으로 들어와
  # train·test 에 같은 사진이 생기는 것을 막는다. 일부러 넣어야 하면 true.
  allow_duplicates: false

# 클래스 목록. 비워두면 DB 옆의 classes.txt(data/visible/classes.txt) -> 시드 라벨의 클래스 ID 순으로 정한다.
# 예: ["helmet", "person", "vest"]
# 순서 = 클래스 번호다. 박스가 번호로 가리키므로 **중간에 끼워 넣거나 빼지 말고 뒤에만 붙일 것.**
# pickup 은 2026-09-20 에 검수 UI 에서 추가한 것을 여기 적어 둔 것이다. 같은 날 넣은 van(8번)은 11-02 에
# car 로 합쳐 뺐다(tools/merge_class.py — 맨 끝이라 다른 번호는 그대로다).
classes: ["bicycle", "bus", "car", "motorcycle", "person", "scooter", "truck", "pickup"]

model:
  # 콜드스타트용 COCO 사전학습 가중치 (최초 1회 자동 다운로드)
  #   yolo26n/s/m = 최신. DFL 대신 L1 로 박스 거리를 학습 (reg_max=1)
  #   yolo11n/s/m = DFL 사용 (reg_max=16)
  # 어느 쪽이든 train.overrides.dfl 은 1.5 로 두어야 합니다. 아래 설명 참고.
  #
  # n -> s 로 올렸습니다 (2026-09-09). 같은 조건 60 epoch A/B 에서
  # mAP50-95 0.6495 -> 0.7288 이고 train/val 손실이 둘 다 낮았습니다.
  # 추론 비용도 s@640 4.47ms 로 n@960 4.58ms 와 같습니다. tools/probe_scale.py 참고.
  # s -> m 으로 올렸습니다 (2026-11-08, 사용자 결정). m 으로 한 8클래스 첫 학습(640 b10, WSL)이
  # 운영 가중치가 됐고, test 749장에서 visible-3(s) 보다 모든 클래스가 높았습니다(pickup 뺀 7클래스
  # 0.6585 -> 0.7398). 아래 train 의 epochs·close_mosaic 도 그 학습과 같은 100·10 이다.
  # 연산은 s 의 약 3.3배(22.8 -> 75.0 GFLOPs)이고 DetectView 도 yolo26m 을 쓴다.
  # docs/experiments.md '8클래스 첫 학습' 참고.
  # 사전학습 가중치는 weights/ 에 모아 둔다 (2026-09-11 정리). 이름만 적어도
  # config.pretrained_path() 가 weights/ 에서 찾지만, 경로를 적는 편이 분명하다.
  base: weights/yolo26m.pt
  # 학습 후 생성되는 가중치. 존재하면 자동 라벨링에 이 파일을 사용.
  weights: models/best.pt
  imgsz: 640
  device: 0            # 0 = 첫 번째 GPU, "cpu" = CPU

train:
  # 운영 m(8클래스 첫 학습 — DetectView y26m 과 같은 설정)과 같게 100 으로 맞췄다 (2026-11-08, 사용자
  # 결정 — 그 전 s 는 300). 그 학습의 best 는 epoch 84 였다. cos_lr 이 총 epoch 에 묶여 있으니 epoch 수가
  # 다른 학습끼리 같은 epoch 의 mAP 를 견주지 말 것.
  epochs: 100
  # (s 시절 기록, batch 20) yolo26s + imgsz 640 기준 실측 VRAM (8GB 카드, AMP):
  #   b16  4.47 GiB   220 ms/step   실제 학습 262초/epoch (300 step)
  #   b20  약 5.5 GiB (추정)         240 step
  #   b24  6.61 GiB   650 ms/step   공유 메모리 페이징 시작 (3배 느림)
  #   b40 10.93 GiB  6866 ms/step   OOM 없이 10배 느려짐 (CLAUDE.md 함정 9)
  #
  # epoch 시간은 스텝 수 x 약 0.87초다. 스텝당 시간이 배치와 거의 무관해서
  # (b4 도 b40 도 1.1 s/it) 배치를 키우면 그만큼 총 시간이 줄어든다.
  # 여유가 빠듯하니(b20 기준 약 460MB) epoch 시간이 튀면 바로 되돌릴 것.
  #
  # yolo26m + imgsz 640 (2026-11-08 부터): b10 이 8GB 에서 들어가는 최대치다(wsl/probe_vram.py,
  # docs/experiments.md 'VRAM'). 11-08 WSL 학습(b10)은 nvidia-smi 6.5~6.6GB, epoch 중앙값 99.6초
  # (373 step)라 100 epoch 이면 약 2.8시간이다(그 학습은 2.74시간). Windows 학습으로는 m 을 재 보지 않았다 — epoch 시간이
  # 튀면(CLAUDE.md 함정 9) 배치를 줄일 것.
  batch: 10
  # 개선 없이 N epoch 지나면 조기 종료.
  # 75 였을 때 close_mosaic 을 만나지 못하고 끝났습니다 — best 184 + 75 = 259 에서
  # 멈췄는데 close_mosaic 은 285 에서 켜질 예정이었습니다. 아래 close_mosaic 참고.
  # epochs 100 에서는 120 이 걸리지 않아 끝까지 간다 — 운영 m 학습도 그랬다 (2026-11-08).
  patience: 120
  # 학습/검증 분할 비율. 배정은 **DB(images.split)에 고정**되고, 새로 승인된 이미지만
  # 클래스 비중이 모자란 쪽으로 들어간다(계층화, src/autolabel/split.py).
  # 이 값을 바꿔도 이미 배정된 이미지는 움직이지 않는다 —
  # 옮기려면 `labeler.py split --reset --yes` 로 전체를 다시 나눠야 한다.
  val_ratio: 0.15
  # 학습에도, best.pt 고르기에도 쓰지 않는 몫. 모델끼리 비교할 때만 쓴다.
  # 0 으로 두면 test 를 만들지 않는다.
  #   python tools/test_baseline.py        (DB 를 읽기 전용으로 열어 test 만 따로 만든다)
  test_ratio: 0.15
  seed: 0
  workers: 4

  # 학습용 데이터셋 폴더(data/visible/dataset)를 만들 때 이미지를 하드링크로 걸지, 복사할지.
  # 하드링크는 용량을 아끼지만 원본과 같은 실체라, Ultralytics 가 깨진 JPEG 을
  # 자동 복구하며 덮어쓰면 원본까지 바뀐다. 기본은 안전한 복사.
  hardlink_images: false

  # 아래 값은 Ultralytics model.train() 에 그대로 전달됩니다.
  # 여기 적은 키가 위의 값보다 우선합니다.
  overrides:
    pretrained: true
    amp: true
    cos_lr: true

    # Windows 에서는 cache: true(=ram) 를 쓰지 말 것.
    # Windows 는 워커 프로세스를 spawn 으로 띄우므로 RAM 캐시(수 GB 의 numpy 배열)를
    # 워커마다 통째로 피클해 보내려다 OSError: [Errno 22] Invalid argument 로 죽는다.
    # 'disk' 는 .npy 경로만 들고 있어 안전하고, 결과도 재현 가능하다.
    #   disk  = .npy 로 캐시. 실측 장당 2.4MB → 약 5,960장이면 **14GB**
    #           (data/visible/dataset 은 이미지 3.3GB + 캐시 14GB = 약 17GB 를 씁니다)
    #   false = 캐시 없음 (디스크를 아끼려면)
    cache: disk

    # 손실 가중치
    box: 7.5
    cls: 1.5
    # 'dfl' 은 이름과 달리 DFL 전용이 아니라 '박스 거리 손실 게인'입니다.
    #   reg_max>1 (yolo11)  -> DFL 에 곱해짐
    #   reg_max==1 (yolo26) -> ltrb L1 손실에 곱해짐
    # 0.0 으로 두면 두 경우 모두 박스 위치 학습이 통째로 꺼집니다. 반드시 0 이 아닌 값으로.
    dfl: 1.5

    # 마지막 N epoch 는 mosaic 증강을 끈다. epochs - N 에서 발동하므로 100-10 = 90.
    # 운영 m 과 같게 10 으로 맞췄다 (2026-11-08 — 그 전 s 는 300-30). 이득은 아직 못 봤다: s 에서 두 번,
    # 운영 m 학습에서도 91~100 평균이 81~90 보다 0.010 낮았다(끄지 않은 학습과 직접 비교한 적은 없다).
    #
    # (s 시절 기록) patience 와 짝을 맞춰야 한다. 조기 종료는 `현재 epoch - best epoch >= patience`
    # 일 때 걸리므로, 270 에 닿으려면 **best 가 epoch 150 이후에 나와야** 한다
    # (150 + 120 = 270). 지난 학습은 15/75 조합이라 항상 못 만나는 구조였다.
    # s 프로브가 60 epoch 에서도 계속 오르던 중이었으니 150 이후일 가능성이 높지만,
    # 그보다 이르면 이번에도 mosaic 을 끄는 구간 없이 끝난다.
    close_mosaic: 10

    # 증강
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    fliplr: 0.5
    flipud: 0.0        # 위아래 뒤집기가 말이 되는 데이터라면 0.5 로

    save_period: 20    # N epoch 마다 체크포인트 저장

predict:
  # 추론 해상도. 비우면 model.imgsz 를 그대로 쓴다.
  #
  # **가중치와 짝을 맞춰야 한다.** 모델마다 최적 해상도가 다르다. 실측 mAP50-95:
  #
  #          yolo26n@640   n을 960미세조정   yolo26s@640(60ep)
  #   640      0.7050         0.6916            0.7311   <- s 는 여기가 정점
  #   960      0.7193         0.7239            0.7294
  #  1280      0.6959          미측정            0.6810
  #
  # n 은 960 이 정점이라 960 을 썼지만, s 는 640 이 정점이다(960 은 -0.0018,
  # 1280 은 -0.0501). 그래서 s 로 갈아타며 640 으로 되돌렸습니다 (2026-09-09).
  # n 계열 가중치로 되돌린다면 이 값도 960 으로 함께 되돌릴 것.
  # m(2026-11-08 운영)은 640 으로 학습·평가했고 다른 해상도는 재지 않았다.
  imgsz: 640
  conf: 0.25           # 이 신뢰도 미만 예측은 버림
  iou: 0.6             # NMS IoU
  max_det: 100
  confident_at: 0.90   # 이 이상이면 UI에서 '확실'로 표시

sam:
  # 검수 UI 의 'SAM 클릭' 모드. 클릭 한 번 또는 대충 그린 박스를
  # 사람이 그린 수준의 박스로 바꿔 준다. 마스크는 저장하지 않고 외접 박스만 쓴다.
  #
  # 모델 비교 실측 (val 12장 / 객체 61개, 정답 박스에 ±15% 지터를 준 것을 입력으로):
  #                      VRAM    인코더  클릭   거친박스→다듬음   클릭 1회만
  #   mobile_sam.pt     0.31GB    18ms  16ms   0.758 → 0.825      0.475
  #   sam2.1_t.pt       0.55GB    13ms  15ms   0.758 → 0.888      0.755   <- 선택
  #
  # sam2.1_t 는 클릭 한 번으로 손으로 그린 박스와 같은 품질이 나오고 실패(IoU<0.5)가
  # 0% 다. 더 큰 sam2.1_s/_b 도 쓸 수 있지만 VRAM 과 지연이 늘고, 이 용도에는
  # t 로 충분했다. 가중치는 weights/ 에 있다(약 80MB).
  enabled: true
  model: weights/sam2.1_t.pt

wsl:
  # 웹 UI 'WSL 학습' 버튼. DB 로 data/visible/dataset 을 만들어 WSL 홈으로 복사한 뒤
  # WSL 에서 학습하고, 끝나면 best.pt 를 models/best.pt 로 가져온다.
  #
  # 같은 설정(yolo26s / 640 / batch 20 / Ultralytics 8.4.142)에서 실측:
  # Windows epoch 258초 -> WSL 62초 (2026-09-12, 중앙값). yolo26m / 640 / batch 10 은
  # WSL epoch 중앙값 99.6초다 (2026-11-08, 학습 3,725장).
  # Linux 라 cache: ram 을 쓸 수 있고(Windows 는 불가) 워커가 fork 로 뜨기 때문이다.
  #
  # 경로는 전부 WSL 안의 경로다. ~ 는 WSL 홈으로 풀린다.
  # 학습 인자(모델·epoch·batch·patience 와 train.overrides 의 증강·손실 게인 전부)는
  # Windows 학습 버튼과 똑같이 넘긴다. 여기 있는 것은 WSL 쪽 사정뿐이다.
  # (train.overrides 의 cache 는 Windows 용이라 WSL 로 가지 않고 아래 cache 를 쓴다)
  enabled: true
  distro: Ubuntu
  python: ~/miniconda3/envs/yolo_final/bin/python   # ultralytics 8.4.142 (2026-09-11 올림)
  project: ~/new_env/yolo/runs_wsl                   # 결과·STOP 파일이 여기
  dataset: ~/datasets/visible                        # data/visible/dataset 의 복사본
  name: visible
  workers: 8            # WSL 에 CPU 12개 할당. fork 라 워커가 싸다
  cache: ram            # WSL 에 RAM 30GB 할당. 이 데이터셋은 5.3GB 를 쓴다

review:
  # 검수 우선순위 점수(불확실도) 계산 파라미터.
  # 애매한 신뢰도(low_band~high_band)의 박스가 많을수록 먼저 검수하게 됨.
  low_band: 0.30
  high_band: 0.80
  # 검출이 하나도 없는 이미지에 주는 불확실도 (미검출 놓침을 잡기 위해)
  empty_score: 0.60

server:
  host: 127.0.0.1
  port: 7860

backup:
  # 검수 서버를 켤 때 하루 한 번 DB 사본을 data/visible/backups/ 에 남긴다 (2026-09-23).
  # 가장 최근 keep 개만 남기고 오래된 사본은 지운다(이 기능이 만든 사본만). 0 이면 끈다.
  # DB 가 7MB 라 14개면 약 100MB.
  keep: 14
