# yolo26 + P2 곁가지 (2026-11-18 실험) — 0–22층은 yolo26.yaml 과 **번호·모양이 그대로**라 사전학습 가중치가 이름으로 전부 얹힌다.
# P2 가지(23–25층)는 P3 특징(16층)과 backbone 의 stride 4 특징(2층)만 읽고 **기존 경로로 되돌아가지 않는다** —
# P3·P4·P5 출력은 사전학습 모델과 같은 계산이다. P2 특징을 256채널로 둔 것은 Detect 의 안쪽 폭(c2·c3)이 첫 입력의
# 채널 수로 정해지기 때문이다(256 이면 사전학습 Detect 와 폭이 같아 P3–P5 머리를 그대로 옮길 수 있다).

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  # --- 새 곁가지: P2/4 ---
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23  P3 특징을 stride 4 로
  - [[-1, 2], 1, Concat, [1]] # 24  cat backbone P2
  - [-1, 2, C3k2, [256, False, 0.25]] # 25 (P2/4-xsmall, 256채널)

  - [[25, 16, 19, 22], 1, Detect, [nc]] # 26 Detect(P2, P3, P4, P5)
