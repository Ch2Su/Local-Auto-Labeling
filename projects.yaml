# 검수 UI 상단 탭에 뜨는 프로젝트 목록 (2026-09-21).
#
# 프로젝트 하나 = config 파일 하나다. 데이터 폴더·DB·가중치·학습 결과가 전부 config 로
# 갈린다. 서버는 프로젝트마다 앱을 따로 만들어 /p/<name>/ 에 붙이므로 서로 섞이지 않는다.
#   name   주소에 쓰는 이름 (영소문자·숫자·_-). 바꾸면 북마크가 깨진다.
#   title  탭에 보이는 이름
#   config 설정 파일 (프로젝트 루트 기준)
#
# 첫 번째 항목이 기본이다 — http://127.0.0.1:7860/ 를 열면 여기로 보낸다.
# 이 파일을 지우면 예전처럼 config.yaml 하나만 띄운다.
# 설정 파일이 없는 항목은 건너뛰고 경고만 낸다. 프로젝트가 하나뿐이면 탭을 그리지 않는다.
#
# 열화상(thermal)·화재 감지(fire)는 2026-09-28 에 뺐다(사용자 결정, 데이터·설정째 삭제).
# 다시 프로젝트를 늘리려면 config.yaml 을 복사해 data:·model.weights·train.overrides.name·
# wsl.dataset·wsl.name 을 전부 새 이름으로 바꾸고 여기에 항목을 더한다.

projects:
  - name: visible
    title: 가시광
    config: config.yaml
