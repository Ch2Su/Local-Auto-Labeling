[pytest]
; Regression tests live in tests/ only. tools/test_baseline.py and tools/test_tiles.py are
; measurement tools that merely start with "test_" - they must not be collected.
testpaths = tests
; No .pytest_cache folder: the auto-commit hook stages every new file in the repo.
addopts = -p no:cacheprovider
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
