# 패키지 정보와 의존성 범위 (2026-11-28, 포터블 앱 7단계 — docs/portable/m01-survey.md).
#
# 여기는 '이 범위면 된다' 는 범위이고, 실제로 깔 버전은 locks/ 의 잠금 파일이 정한다(OS·GPU 마다 — locks/README.md).
# 이 PC·노트북의 개발 환경은 그대로다: 노트북은 requirements.txt(Windows · Python 3.14 · CUDA 13.0), 이 데스크탑은
# locks/win-cu134-py315.txt 와 같은 판이다. `.venv` 는 다른 프로젝트도 빌려 쓰니 이 파일로 그 안에 설치하지 말 것.
#
# **설치는 소스 폴더에서 `pip install -e .`(편집 모드)만 된다.** 그냥 `pip install .` 로 site-packages 에 넣으면
# paths.APP 이 소스 저장소를 못 찾아 설정·데이터 자리가 틀린다(배포판은 PyInstaller 로 따로 — 계획 8단계 뒤).
#
# 범위의 아래쪽은 확인한 판(노트북 requirements.txt), 위쪽은 대부분 다음 큰 판 앞이다. 예외: ultralytics 는 확인한 판까지만 —
# 정지·스냅샷·이어하기가 Ultralytics 내부 순서에 기대서(CLAUDE.md 함정 8) 올리기 전에 소스로 다시 볼 것(8.4.142 · 8.4.212 확인).
# 범위를 바꾸면 locks/ 를 다시 만들고 tests/test_deps.py 를 돌린다.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-auto-labeling"
version = "0.1.0"
description = "소량의 손라벨로 YOLO 를 학습시켜 나머지를 자동 라벨링하고 웹에서 검수하는 로컬 도구"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# 확인한 것: 3.14(노트북 — 3.14.1 은 torchvision 0.29.0 이 받지 않는다)·3.15(데스크탑). 더 낮은 판은 돌려 보지 않았다.
requires-python = ">=3.14"
dependencies = [
    # PyTorch — CUDA·CPU·MPS 빌드는 받는 곳(인덱스)이 달라 잠금 파일이 고른다(locks/README.md).
    "torch>=2.14",
    "torchvision>=0.29",
    "ultralytics>=8.4.142,<=8.4.212",
    # capture.py·autopick.py 가 영상을 직접 읽는다(Ultralytics 도 쓴다)
    "opencv-python>=5.0",
    # 검수 웹 UI
    "fastapi>=0.141",
    "pydantic>=2.13,<3",
    "uvicorn[standard]>=0.52",
    # 11.3 부터 AVIF(yolo_io.IMG_EXTS) — 11.0 은 확장자만 .png 인 JPEG 의 EXIF 에서 죽었다
    "pillow>=11.3",
    "PyYAML>=6.0",
    "numpy>=2.5,<3",
]

[project.optional-dependencies]
# 회귀 테스트(tests/) — fastapi 의 TestClient 가 httpx 를 쓴다. 화면(JS) 테스트는 node 를 찾는다(없으면 건너뛴다).
test = ["pytest>=9.2", "httpx>=0.28"]
# tools/label_qa_claude.py (Claude API 파일럿) 만
claude = ["anthropic>=1.6"]
# tools/import_roadplus.py 가 ffmpeg 를 PATH 에서 못 찾을 때만
roadplus = ["imageio-ffmpeg"]
# tools/ovd_propose.py(OWLv2 — transformers)는 일부러 다른 가상 환경에서 돈다(그 파일 머리말) — 여기에 넣지 않는다.

[project.scripts]
labeler = "autolabel.cli:main"

[project.urls]
Repository = "https://github.com/Ch2Su/Local-Auto-Labeling"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autolabel*"]

[tool.setuptools.package-data]
autolabel = ["web/*"]
